name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  bin: certwatch }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bin: certwatch.exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,      bin: certwatch }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} README.md LICENSE examples/certwatch.toml dist/
          cd dist && tar czf ../certwatch-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
      - uses: softprops/action-gh-release@v2
        with:
          files: certwatch-*.tar.gz
